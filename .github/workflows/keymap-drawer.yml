name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/draw.py"
      - "Makefile"
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap-drawer/config.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install draw dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install keymap-drawer PyYAML

      - name: Generate keymap diagrams
        run: python scripts/draw.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/*.yaml keymap-drawer/*.svg
          if git diff --staged --quiet; then
            echo "No keymap-drawer changes to commit"
            exit 0
          fi
          git commit -m "[Draw] ${{ github.event.head_commit.message || 'update keymap drawings' }}"
          git push
