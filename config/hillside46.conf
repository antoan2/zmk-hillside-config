# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal when troubleshooting weak/unreliable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Optional troubleshooting setting from connection issues doc
# (helps some hosts/chipsets during pairing)
# CONFIG_BT_CTLR_PHY_2M=n

CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

CONFIG_ZMK_KEYBOARD_NAME="KB_TONIO"
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=5
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=5
CONFIG_ZMK_POINTING=y