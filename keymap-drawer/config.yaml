parse_config:
  raw_binding_map:
    '&vim_save': :w
    '&vim_save_quit': :wq
    '&cut': cut
    '&copy': copy
    '&paste': paste
    '&shift_paste': shift + paste
    '&caps_word': CAPS
    '&special_e_aigu': é
    '&special_e_aigu_maj': É
    '&special_e_grave': è
    '&special_e_grave_maj': È
    '&special_e_hat': ê
    '&special_e_hat_maj': Ê
    '&special_e_trema': ë
    '&special_e_trema_maj': Ë
    '&special_a_grave': à
    '&special_a_grave_maj': À
    '&special_a_hat': â
    '&special_a_hat_maj': Â
    '&special_u_grave': ù
    '&special_u_grave_maj': Ù
    '&special_u_hat': û
    '&special_u_hat_maj': Û
    '&special_i_hat': î
    '&special_i_hat_maj': Î
    '&special_o_hat': ô
    '&special_o_hat_maj': Ô
    '&special_aigu': dead '
    '&special_grave': dead `
    '&special_hat': dead ^
    '&special_trema': dead "

    # Mouse movement bindings (direct &mmv usage)
    '&mmv MOVE_UP': ↑
    '&mmv MOVE_DOWN': ↓
    '&mmv MOVE_LEFT': ←
    '&mmv MOVE_RIGHT': →
    '&mmv MOVE_UL': ↖
    '&mmv MOVE_UR': ↗
    '&mmv MOVE_DL': ↙
    '&mmv MOVE_DR': ↘

    '&msc SCRL_UP': Scroll ↑
    '&msc SCRL_DOWN': Scroll ↓
    '&msc SCRL_LEFT': Scroll ←
    '&msc SCRL_RIGHT': Scroll →

    '&mkp LCLK': LClick
    '&mkp RCLK': RClick
    '&mkp MCLK': MClick

    '&sl MOU_TP_L': teleport
    '&mouse_thumb MOU_FAST_L MOU_TP_L': {t: teleport, h: fast}

    # Teleport positions - Screen 1 (direct &mmv_tele)
    '&mmv_tele TELE_S1_T1': S1 T1
    '&mmv_tele TELE_S1_T2': S1 T2
    '&mmv_tele TELE_S1_T3': S1 T3
    '&mmv_tele TELE_S1_T4': S1 T4
    '&mmv_tele TELE_S1_M1': S1 M1
    '&mmv_tele TELE_S1_M2': S1 M2
    '&mmv_tele TELE_S1_M3': S1 M3
    '&mmv_tele TELE_S1_M4': S1 M4
    '&mmv_tele TELE_S1_B1': S1 B1
    '&mmv_tele TELE_S1_B2': S1 B2
    '&mmv_tele TELE_S1_B3': S1 B3
    '&mmv_tele TELE_S1_B4': S1 B4

    # Teleport positions - Screen 2
    '&mmv_tele TELE_S2_T1': S2 T1
    '&mmv_tele TELE_S2_T2': S2 T2
    '&mmv_tele TELE_S2_T3': S2 T3
    '&mmv_tele TELE_S2_T4': S2 T4
