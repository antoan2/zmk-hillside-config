parse_config:
  raw_binding_map:
    '&vim_save': :w
    '&vim_save_quit': :wq
    '&ht_special_mouse':
      t: SPE
      h: MOU ↔
    '&caps_word': CAPS
    '&tog NAV_L': NAV ↔
    '&ht_e_aigu': {t: é, h: É}
    '&ht_e_grave': {t: è, h: È}
    '&ht_e_hat': {t: ê, h: Ê}
    '&ht_e_trema': {t: ë, h: Ë}
    '&ht_a_grave': {t: à, h: À}
    '&ht_a_hat': {t: â, h: Â}
    '&ht_u_grave': {t: ù, h: Ù}
    '&ht_u_hat': {t: û, h: Û}
    '&ht_i_hat': {t: î, h: Î}
    '&ht_o_hat': {t: ô, h: Ô}
    '&ht_1_f1': {t: '1', h: F1}
    '&ht_2_f2': {t: '2', h: F2}
    '&ht_3_f3': {t: '3', h: F3}
    '&ht_4_f4': {t: '4', h: F4}
    '&ht_5_f5': {t: '5', h: F5}
    '&ht_6_f6': {t: '6', h: F6}
    '&ht_7_f7': {t: '7', h: F7}
    '&ht_8_f8': {t: '8', h: F8}
    '&ht_9_f9': {t: '9', h: F9}
    '&special_e_aigu': é
    '&special_e_aigu_twice': éé
    '&special_e_aigu_maj': É
    '&special_e_grave': è
    '&special_e_grave_maj': È
    '&special_e_hat': ê
    '&special_e_hat_maj': Ê
    '&special_e_trema': ë
    '&special_e_trema_maj': Ë
    '&special_a_grave': à
    '&special_a_grave_maj': À
    '&special_a_hat': â
    '&special_a_hat_maj': Â
    '&special_u_grave': ù
    '&special_u_grave_maj': Ù
    '&special_u_hat': û
    '&special_u_hat_maj': Û
    '&special_i_hat': î
    '&special_i_hat_maj': Î
    '&special_o_hat': ô
    '&special_o_hat_maj': Ô
    '&special_aigu': dead '
    '&special_grave': dead `
    '&special_hat': dead ^
    '&special_trema': dead "
    '&sym_paren_pair': ()
    '&sym_bracket_pair': '[]'

    # Native mouse clicks
    '&mkp LCLK': LClick
    '&mkp RCLK': RClick
    '&mkp MCLK': MClick

    # Daemon movement signals (normal)
    '&kp SIG_UP': ↑
    '&kp SIG_DOWN': ↓
    '&kp SIG_LEFT': ←
    '&kp SIG_RIGHT': →

    # Daemon mode modifier signals
    '&kp SIG_PRECISION': 🎯 Slow
    '&kp SIG_SCROLL': 📜 Scroll

    # Teleport signals - Screen 1
    '&kp TP_S1_TL': S1 ↖
    '&kp TP_S1_TR': S1 ↗
    '&kp TP_S1_BL': S1 ↙
    '&kp TP_S1_BR': S1 ↘

    # Teleport signals - Screen 2
    '&kp TP_S2_TL': S2 ↖
    '&kp TP_S2_TR': S2 ↗
    '&kp TP_S2_BL': S2 ↙
    '&kp TP_S2_BR': S2 ↘

    # Teleport signals - Screen 3
    '&kp TP_S3_TL': S3 ↖
    '&kp TP_S3_TR': S3 ↗
    '&kp TP_S3_BL': S3 ↙
    '&kp TP_S3_BR': S3 ↘

  # Layer legend map - provide friendly names for layers
  layer_legend_map:
    mouse_layer: 🖱️ Mouse
    
  zmk_keycode_map:
