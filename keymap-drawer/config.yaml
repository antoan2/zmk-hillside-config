parse_config:
  raw_binding_map:
    '&vim_save': :w
    '&vim_save_quit': :wq
    '&cut': cut
    '&copy': copy
    '&paste': paste
    '&shift_paste': shift + paste
    '&caps_word': CAPS
    '&special_e_aigu': é
    '&special_e_aigu_maj': É
    '&special_e_grave': è
    '&special_e_grave_maj': È
    '&special_e_hat': ê
    '&special_e_hat_maj': Ê
    '&special_e_trema': ë
    '&special_e_trema_maj': Ë
    '&special_a_grave': à
    '&special_a_grave_maj': À
    '&special_a_hat': â
    '&special_a_hat_maj': Â
    '&special_u_grave': ù
    '&special_u_grave_maj': Ù
    '&special_u_hat': û
    '&special_u_hat_maj': Û
    '&special_i_hat': î
    '&special_i_hat_maj': Î
    '&special_o_hat': ô
    '&special_o_hat_maj': Ô
    '&special_aigu': dead '
    '&special_grave': dead `
    '&special_hat': dead ^
    '&special_trema': dead "

    # Native mouse clicks
    '&mkp LCLK': LClick
    '&mkp RCLK': RClick
    '&mkp MCLK': MClick

    # Daemon movement signals (normal)
    '&kp SIG_UP': ↑
    '&kp SIG_DOWN': ↓
    '&kp SIG_LEFT': ←
    '&kp SIG_RIGHT': →

    # Daemon mode modifier signals
    '&kp SIG_PRECISION': 🎯 Slow
    '&kp SIG_SCROLL': 📜 Scroll

    # Teleport signals - Screen 1
    '&kp TP_S1_TL': S1 ↖
    '&kp TP_S1_TR': S1 ↗
    '&kp TP_S1_BL': S1 ↙
    '&kp TP_S1_BR': S1 ↘

    # Teleport signals - Screen 2
    '&kp TP_S2_TL': S2 ↖
    '&kp TP_S2_TR': S2 ↗
    '&kp TP_S2_BL': S2 ↙
    '&kp TP_S2_BR': S2 ↘

    # Teleport signals - Screen 3
    '&kp TP_S3_TL': S3 ↖
    '&kp TP_S3_TR': S3 ↗
    '&kp TP_S3_BL': S3 ↙
    '&kp TP_S3_BR': S3 ↘

  # Layer legend map - provide friendly names for layers
  layer_legend_map:
    mouse_layer: 🖱️ Mouse
    mouse_precision_layer: 🖱️ Precision
    mouse_scroll_layer: 🖱️ Scroll
    
