parse_config:
  raw_binding_map:
    '&vim_save': :w
    '&vim_save_quit': :wq
    '&cut': cut
    '&copy': copy
    '&paste': paste
    '&shift_paste': shift + paste
    '&caps_word': CAPS
    '&special_e_aigu': é
    '&special_e_aigu_maj': É
    '&special_e_grave': è
    '&special_e_grave_maj': È
    '&special_e_hat': ê
    '&special_e_hat_maj': Ê
    '&special_e_trema': ë
    '&special_e_trema_maj': Ë
    '&special_a_grave': à
    '&special_a_grave_maj': À
    '&special_a_hat': â
    '&special_a_hat_maj': Â
    '&special_u_grave': ù
    '&special_u_grave_maj': Ù
    '&special_u_hat': û
    '&special_u_hat_maj': Û
    '&special_i_hat': î
    '&special_i_hat_maj': Î
    '&special_o_hat': ô
    '&special_o_hat_maj': Ô
    '&special_aigu': dead '
    '&special_grave': dead `
    '&special_hat': dead ^
    '&special_trema': dead "

    '&mmv MOVE_UP': Mouse ↑
    '&mmv MOVE_DOWN': Mouse ↓
    '&mmv MOVE_LEFT': Mouse ←
    '&mmv MOVE_RIGHT': Mouse →

    '&mmv_up_left': Mouse ↖
    '&mmv_up_right': Mouse ↗
    '&mmv_down_left': Mouse ↙
    '&mmv_down_right': Mouse ↘

    '&mmv_fast_up': Fast ↑
    '&mmv_fast_down': Fast ↓
    '&mmv_fast_left': Fast ←
    '&mmv_fast_right': Fast →
    '&mmv_fast_up_left': Fast ↖
    '&mmv_fast_up_right': Fast ↗
    '&mmv_fast_down_left': Fast ↙
    '&mmv_fast_down_right': Fast ↘

    '&msc SCRL_UP': Scroll ↑
    '&msc SCRL_DOWN': Scroll ↓
    '&msc SCRL_LEFT': Scroll ←
    '&msc SCRL_RIGHT': Scroll →
    '&msc_jump_up': Page ↑
    '&msc_jump_down': Page ↓

    '&mkp LCLK': LClick
    '&mkp RCLK': RClick
    '&mkp MCLK': MClick

    '&mouse_thumb MOU_FAST_L MOU_TP_L': {t: teleport, h: fast}

    # Teleport macros - Screen 1
    '&tp_s1_r0_c0': S1 TL1
    '&tp_s1_r0_c1': S1 TL2
    '&tp_s1_r0_c2': S1 TR1
    '&tp_s1_r0_c3': S1 TR2
    '&tp_s1_r1_c0': S1 ML1
    '&tp_s1_r1_c1': S1 ML2
    '&tp_s1_r1_c2': S1 MR1
    '&tp_s1_r1_c3': S1 MR2
    '&tp_s1_r2_c0': S1 BL1
    '&tp_s1_r2_c1': S1 BL2
    '&tp_s1_r2_c2': S1 BR1
    '&tp_s1_r2_c3': S1 BR2

    # Teleport macros - Screen 2
    '&tp_s2_r0_c0': S2 TL1
    '&tp_s2_r0_c1': S2 TL2
    '&tp_s2_r0_c2': S2 TR1
    '&tp_s2_r0_c3': S2 TR2
    '&tp_s2_r1_c0': S2 ML1
    '&tp_s2_r1_c1': S2 ML2
    '&tp_s2_r1_c2': S2 MR1
    '&tp_s2_r1_c3': S2 MR2
    '&tp_s2_r2_c0': S2 BL1
    '&tp_s2_r2_c1': S2 BL2
    '&tp_s2_r2_c2': S2 BR1
    '&tp_s2_r2_c3': S2 BR2

    # Teleport macros - Screen 3
    '&tp_s3_r0_c0': S3 TL1
    '&tp_s3_r0_c1': S3 TL2
    '&tp_s3_r0_c2': S3 TR1
    '&tp_s3_r0_c3': S3 TR2
    '&tp_s3_r1_c0': S3 ML1
    '&tp_s3_r1_c1': S3 ML2
    '&tp_s3_r1_c2': S3 MR1
    '&tp_s3_r1_c3': S3 MR2
    '&tp_s3_r2_c0': S3 BL1
    '&tp_s3_r2_c1': S3 BL2
    '&tp_s3_r2_c2': S3 BR1
    '&tp_s3_r2_c3': S3 BR2
    
  zmk_keycode_map:
    LCTRL: Ctrl
    RCTRL: Ctrl
    LALT: Alt
    RALT: Alt
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    ESC: Esc
    SPACE: ␣
    BSPC: ⌫
    RET: ⏎
    TAB: ↹
    DEL: ⌦
    # defaults
    AMPERSAND: '&'
    AMPS: '&'
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: '*'
    ASTRK: '*'
    AT: '@'
    AT_SIGN: '@'
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ':'
    COMMA: ','
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: '='
    EXCL: '!'
    EXCLAMATION: '!'
    FSLH: /
    GRAVE: '`'
    GREATER_THAN: '>'
    GT: '>'
    HASH: '#'
    LBKT: '['
    LBRC: '{'
    LEFT_BRACE: '{'
    LEFT_BRACKET: '['
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: '-'
    NON_US_BACKSLASH: \
    NON_US_BSLH: '|'
    NON_US_HASH: '#'
    NUHS: '#'
    PERCENT: '%'
    PERIOD: .
    PIPE: '|'
    PIPE2: '|'
    PLUS: +
    POUND: '#'
    PRCNT: '%'
    QMARK: '?'
    QUESTION: '?'
    RBKT: ']'
    RBRC: '}'
    RIGHT_BRACE: '}'
    RIGHT_BRACKET: ']'
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ;
    SEMICOLON: ;
    SINGLE_QUOTE: ''''
